[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resumeproof"
version = "0.1.0"
description = "Truth-First Agentic Mock Interview and Defensible Resume Tailoring Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ResumeProof Team" }
]
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "pdfplumber>=0.10.0",
    "pypdf>=3.0.0",
    "reportlab>=4.0.0",
    "jinja2>=3.1.0",
    "click>=8.0.0",
    "python-multipart>=0.0.6",
    "pydantic-settings>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --cov=resumeproof --cov-report=term-missing -m \"not real_model\""
markers = [
    "parsing_pipeline: tests validating schema and pipeline mechanics via FakeLLMClient",
    "real_model: tests running against live local Ollama LLMs (skipped by default; run with `pytest -m real_model`)",
]
